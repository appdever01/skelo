name: Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
        with:
          version: 11.7.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm smoke:package
      - run: pnpm smoke:packed

  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: flutter/flutter
          ref: 3.44.2
          path: .local/flutter-sdk
      - run: .local/flutter-sdk/bin/flutter --version
      - run: ../../.local/flutter-sdk/bin/flutter pub get
        working-directory: packages/flutter
      - run: ../../.local/flutter-sdk/bin/flutter analyze
        working-directory: packages/flutter
      - run: ../../.local/flutter-sdk/bin/flutter test --concurrency=2
        working-directory: packages/flutter
      - run: ../../../.local/flutter-sdk/bin/flutter pub get
        working-directory: packages/flutter/example
      - run: ../../../.local/flutter-sdk/bin/flutter analyze
        working-directory: packages/flutter/example
      - run: ../../../.local/flutter-sdk/bin/flutter test --concurrency=2
        working-directory: packages/flutter/example
      - run: ../../../.local/flutter-sdk/bin/flutter build web
        working-directory: packages/flutter/example
